taxonomy_version: theme_taxonomy_v1.0.1
effective_from: "2026-01-01"
description: "Versioned migration taxonomy for KQUANT US equities research. Rules use only point-in-time universe metadata."
definitions:
  - id: theme.unmapped
    dimension_type: theme
    slug: unmapped
    display_name: Unmapped / review required
    aliases: [unmapped, review_required]
    status: fallback
    rule:
      match: never
  - id: theme.ai_infrastructure
    dimension_type: theme
    slug: ai-infrastructure
    display_name: AI Infrastructure
    aliases: [ai, ai_infra, ai_semis, compute, chips]
    status: active
    rule:
      tags_any: [ai, ai_core, ai_infra, ai_semis, chips, semiconductor, semiconductors]
      layers_any: [Chips, AI Chips, AI Infra, Compute]
  - id: theme.cloud_software
    dimension_type: theme
    slug: cloud-software
    display_name: Cloud and Software
    aliases: [cloud, software, saas, cybersecurity]
    status: active
    rule:
      tags_any: [cloud, software, saas, cybersecurity, cyber]
      layers_any: [Cloud, AI Cloud, Software, Cybersecurity]
  - id: theme.space_defense
    dimension_type: theme
    slug: space-defense
    display_name: Space and Defense
    aliases: [space, defense, aerospace]
    status: active
    rule:
      tags_any: [space, aerospace, defense, drones]
      layers_any: [Space, Space Exploration, Defense, Drones]
  - id: theme.robotics_automation
    dimension_type: theme
