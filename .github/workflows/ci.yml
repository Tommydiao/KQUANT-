name: KQUANT CI

on:
  workflow_dispatch:
  push:
    branches: [main, "codex/**"]
  pull_request:

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Python dependencies
        run: python -m pip install -e ".[dev]"
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci
      - name: Audit frontend production dependencies
        working-directory: web
        run: npm audit --omit=dev --audit-level=high
      - name: Run frontend static checks
        working-directory: web
        run: npm run lint
      - name: Run frontend tests
        working-directory: web
        run: npm test
      - name: Build frontend
        working-directory: web
        run: npm run build
      - name: Run Python tests
        shell: pwsh
        run: |
          $output = & python -m pytest -q --maxfail=1 --junitxml=pytest-report.xml 2>&1
          $exitCode = $LASTEXITCODE
          $output | Tee-Object -FilePath pytest-output.log | Write-Host
          if ($exitCode -ne 0) {
            $tail = (($output | Select-Object -Last 60) -join "%0A")
            Write-Host "::error title=Root pytest failure::$tail"
            exit $exitCode
          }
      - name: Upload root pytest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: root-pytest-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            pytest-output.log
            pytest-report.xml
          if-no-files-found: warn
          retention-days: 7
      - name: Scan tracked files for credentials
        run: python scripts/scan_tracked_secrets.py
      - name: Verify read-only runtime boundary
        run: python scripts/verify_read_only_boundary.py

  verify-crypto:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: crypto
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: crypto/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: |
            crypto/web/package-lock.json
            platform/web/package-lock.json
      - name: Install Crypto Python dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run Crypto Python tests
        shell: pwsh
        run: |
          $output = & python -m pytest -q --maxfail=1 --junitxml=pytest-report.xml 2>&1
          $exitCode = $LASTEXITCODE
          $output | Tee-Object -FilePath pytest-output.log | Write-Host
          if ($exitCode -ne 0) {
            $tail = (($output | Select-Object -Last 60) -join "%0A")
            Write-Host "::error title=Crypto pytest failure::$tail"
            exit $exitCode
          }
      - name: Upload Crypto pytest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-pytest-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            crypto/pytest-output.log
            crypto/pytest-report.xml
          if-no-files-found: warn
          retention-days: 7
      - name: Install Crypto frontend dependencies
        working-directory: crypto/web
        run: npm ci
      - name: Audit Crypto frontend production dependencies
        working-directory: crypto/web
        run: npm audit --omit=dev --audit-level=high
      - name: Run Crypto frontend static checks
        working-directory: crypto/web
        run: npm run lint
      - name: Run Crypto frontend tests
        working-directory: crypto/web
        run: npm test -- --run
      - name: Build Crypto frontend
        working-directory: crypto/web
        run: npm run build
      - name: Install unified platform frontend
        working-directory: platform/web
        run: npm ci
      - name: Audit unified platform frontend
        working-directory: platform/web
        run: npm audit --omit=dev --audit-level=high
      - name: Run unified platform static checks
        working-directory: platform/web
        run: npm run lint
      - name: Run unified platform tests
        working-directory: platform/web
        run: npm test -- --run
      - name: Build unified platform frontend
        working-directory: platform/web
        run: npm run build
      - name: Verify gateway with unified platform build
        run: python -m pytest tests/test_operations.py -q
      - name: Scan tracked files for credentials
        working-directory: .
        run: python scripts/scan_tracked_secrets.py --root .
      - name: Verify Crypto read-only runtime boundary
        run: python scripts/verify_read_only_boundary.py
