name: Verify KQUANT

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Python dependencies
        run: python -m pip install -e ".[dev]"
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci
      - name: Run reproducible verification
        shell: powershell
        run: |
          .\verify_kquant_local.ps1 -SkipReadiness -Strict
          # A skipped local-market readiness probe is expected in GitHub-hosted
          # CI. Code 2 means all critical source/build/test checks passed.
          if ($LASTEXITCODE -eq 2) { exit 0 }
          exit $LASTEXITCODE
