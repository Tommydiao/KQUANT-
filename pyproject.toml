[project]
name = "kquant"
version = "0.2.0"
description = "US stock signal terminal with read-only research workflows."
requires-python = ">=3.11"
dependencies = [
  "exchange-calendars>=4.8",
  "fastapi>=0.115",
  "longbridge>=0.2",
  "numpy>=2.0",
  "pandas>=2.2",
  "PyYAML>=6.0",
  "pywebpush>=2.0",
  "requests>=2.32",
  "rich>=13.7",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28",
  "pytest>=8.0",
]

[project.scripts]
kquant = "kquant.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["kquant*"]
